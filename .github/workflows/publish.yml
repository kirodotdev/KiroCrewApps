name: Publish catalog

# Manual only, deliberately. Publishing mints a signed artifact that clients will
# accept as authoritative, so it is an action someone takes, not a side effect of
# merging. (A scheduled or on-push trigger can be added once there is a
# distribution target to push to.)
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build without resolving refs, baking, or signing"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r tools/requirements.txt pytest

      # Same gate as the PR workflow. Publishing runs it again rather than
      # trusting that main was green: the catalog is data, and the thing being
      # signed is whatever is on disk right now.
      - name: Contract and pipeline tests
        run: pytest tests/ -q

      - name: Validate authored catalog
        run: python tools/validate.py

      - name: Publish (dry run)
        if: inputs.dry_run
        run: python tools/publish.py --out dist --dry-run

      # The key is written to a file because that is what the signer takes, and
      # never echoed. `umask 077` is set before the write so it is not briefly
      # world-readable on a shared runner. publish.py fails closed when the
      # secret is absent, so a missing key cannot silently produce an unsigned
      # catalog -- it produces no catalog.
      - name: Publish (signed)
        if: ${{ !inputs.dry_run }}
        env:
          SIGNING_KEY_PEM: ${{ secrets.REGISTRY_SIGNING_KEY }}
        run: |
          if [ -z "${SIGNING_KEY_PEM:-}" ]; then
            echo "::error::REGISTRY_SIGNING_KEY is not configured. A signature is" \
                 "the acceptance gate for Official trust, so this workflow will not" \
                 "emit an unsigned catalog. Assign signing-key custody first."
            exit 1
          fi
          umask 077
          keyfile="$(mktemp)"
          printf '%s' "$SIGNING_KEY_PEM" > "$keyfile"
          KIROCREW_REGISTRY_SIGNING_KEY="$keyfile" python tools/publish.py --out dist
          shred -u "$keyfile" 2>/dev/null || : > "$keyfile"

      - name: Verify emitted artifacts
        run: |
          python - <<'PY'
          import json, pathlib, sys
          dist = pathlib.Path("dist")
          registry = json.loads((dist / "official-registry.json").read_text())
          assert registry["schemaVersion"] == 1, registry["schemaVersion"]
          print(f"revision {registry['revision']}  apps={len(registry['apps'])}")
          for f in sorted(dist.iterdir()):
              print(f"  {f.name} ({f.stat().st_size} bytes)")
          PY

      # Where distribution begins. There is no CDN target wired here yet, so the
      # artifacts are retained for inspection instead of being pushed anywhere --
      # nothing this workflow produces reaches a client today.
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: catalog-${{ github.sha }}
          path: dist/
          retention-days: 30
          if-no-files-found: error
