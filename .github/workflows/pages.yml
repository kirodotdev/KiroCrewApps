name: Deploy catalog to Pages

# Serves the published catalog at a fetchable URL.
#
# Only `dist/` is uploaded -- the built documents and their signatures. The rest
# of the repository (authored catalog, tooling, tests) is never part of the Pages
# artifact, so making the site public does not publish the repository.
on:
  push:
    branches: [main]
    paths:
      - "catalog/**"
      - "schema/**"
      - "keys/**"
      - "tools/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A half-finished deploy is worse than a late one: readers would fetch a document
# whose signature was minted for different bytes. Never cancel in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r tools/requirements.txt pytest

      # The artifact about to be signed is whatever is on disk right now, so the
      # gate runs here too rather than trusting that main was green.
      - name: Contract and pipeline tests
        run: pytest tests/ -q

      - name: Publish (signed)
        env:
          SIGNING_KEY_PEM: ${{ secrets.REGISTRY_SIGNING_KEY }}
        run: |
          if [ -z "${SIGNING_KEY_PEM:-}" ]; then
            echo "::error::REGISTRY_SIGNING_KEY is not configured; refusing to" \
                 "publish an unsigned catalog."
            exit 1
          fi
          umask 077
          keyfile="$(mktemp)"
          printf '%s' "$SIGNING_KEY_PEM" > "$keyfile"
          KIROCREW_REGISTRY_SIGNING_KEY="$keyfile" python tools/publish.py --out dist
          shred -u "$keyfile" 2>/dev/null || : > "$keyfile"

      # Verify what is about to be served, against the PUBLIC key committed to
      # the repo -- not against the signer's own output. This is the check that
      # would catch a signature minted over different bytes than the file.
      - name: Verify signatures against the published public key
        run: |
          python - <<'PY'
          import base64, hashlib, json, pathlib, sys
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey

          dist = pathlib.Path("dist")
          keys = {
              p.name.removeprefix("bootstrap-").removesuffix(".pub"):
                  base64.b64decode(p.read_text().strip())
              for p in pathlib.Path("keys").glob("*.pub")
          }
          checked = 0
          for doc in sorted(dist.glob("*.json")):
              sig_path = dist / f"{doc.name}.sig"
              if not sig_path.exists():
                  sys.exit(f"{doc.name}: no signature sidecar")
              payload = doc.read_bytes()
              sidecar = json.loads(sig_path.read_text())
              if sidecar["keyId"] not in keys:
                  sys.exit(f"{doc.name}: signed by unpublished key {sidecar['keyId']}")
              if sidecar["payloadSha256"] != hashlib.sha256(payload).hexdigest():
                  sys.exit(f"{doc.name}: payload digest mismatch")
              Ed25519PublicKey.from_public_bytes(keys[sidecar["keyId"]]).verify(
                  base64.b64decode(sidecar["signature"]), payload
              )
              print(f"verified {doc.name} ({len(payload)} bytes, key {sidecar['keyId']})")
              checked += 1
          if not checked:
              sys.exit("no documents to serve")
          PY

      # A tiny index so the URL is discoverable by a human, and the verification
      # key travels with the documents that need it.
      - name: Assemble the site
        run: |
          mkdir -p dist/keys
          cp keys/*.pub dist/keys/
          cp keys/README.md dist/keys/
          python - <<'PY'
          import json, pathlib
          reg = json.loads(pathlib.Path("dist/official-registry.json").read_text())
          pathlib.Path("dist/index.html").write_text(f"""<!doctype html>
          <html lang="en"><meta charset="utf-8">
          <title>KiroCrew app catalog</title>
          <body style="font:16px/1.6 system-ui;max-width:44rem;margin:3rem auto;padding:0 1rem">
          <h1>KiroCrew app catalog</h1>
          <p>Revision <code>{reg['revision']}</code> &middot; {len(reg['apps'])} app(s)</p>
          <ul>
            <li><a href="official-registry.json">official-registry.json</a>
                (<a href="official-registry.json.sig">signature</a>)</li>
            <li><a href="editorial.json">editorial.json</a>
                (<a href="editorial.json.sig">signature</a>)</li>
            <li><a href="keys/">verification keys</a></li>
          </ul>
          <p><strong>Signed with a bootstrap key.</strong> Do not ship a client that
          trusts it &mdash; see <a href="keys/README.md">keys/README.md</a>.</p>
          </body></html>
          """)
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
